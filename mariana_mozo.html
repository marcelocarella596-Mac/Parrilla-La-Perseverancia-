<script>


// =====================================
// FIREBASE
// =====================================


const firebaseConfig={

apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",

authDomain:
"parrilla-la-perseveranci-f3f54.firebaseapp.com",

databaseURL:
"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",

projectId:
"parrilla-la-perseveranci-f3f54"

};


if(!firebase.apps.length)
firebase.initializeApp(firebaseConfig);



const db=firebase.database();


// =====================================
// CORE ESTADOS
// =====================================


const ESTADOS={

RECIBIDO:"RECIBIDO",

PREPARACION:"PREPARACION",

LISTO:"LISTO",

ENTREGADO_SECTOR:"ENTREGADO_SECTOR",

MANOS_EN_MESA:"MANOS_EN_MESA"

};



const ESTACIONES={

PARRILLA:"PARRILLA",

COCINA:"COCINA",

MIXTA:"MIXTA"

};



let carrito=[];

let comandas={};

let menu=[

{
nombre:"Choripán",
precio:5000
},

{
nombre:"Morcipán",
precio:5000
},

{
nombre:"Asado",
precio:12000
},

{
nombre:"Asado c/fritas",
precio:17000
},

{
nombre:"Vacío c/fritas",
precio:17000
},

{
nombre:"Milanesa",
precio:12000
},

{
nombre:"Sandwich Milanesa",
precio:7000
}

];


// =====================================
// MOTOR ESTACION
// =====================================


function normalizar(t){

return (t||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

}



function detectarEstacion(nombre){

let n=normalizar(nombre);


let parrilla=[

"asado",
"vacio",
"vacío",
"chorizo",
"morcilla",
"choripan",
"morcipan"

];


let cocina=[

"frita",
"milanesa",
"suprema"

];



let p=
parrilla.some(x=>n.includes(x));


let c=
cocina.some(x=>n.includes(x));



if(p&&c)
return ESTACIONES.MIXTA;


if(p)
return ESTACIONES.PARRILLA;



return ESTACIONES.COCINA;


}

// =====================================
// CREAR ITEM OPERATIVO
// =====================================


function prepararItem(item){


return {

nombre:item.nombre,

precio:item.precio,

cantidad:item.cantidad || 1,


estacion:
detectarEstacion(item.nombre),


estadoItem:
ESTADOS.RECIBIDO,


timestamp:
Date.now()

};


}




// =====================================
// AGREGAR PRODUCTO
// =====================================


function agregarProducto(nombre){


let prod=
menu.find(
p=>p.nombre===nombre
);


if(!prod)return;


let existe=
carrito.find(
x=>x.nombre===nombre
);



if(existe){

existe.cantidad++;

}else{


carrito.push({

...prod,

cantidad:1

});


}


renderCarrito();


}




// =====================================
// RENDER PRODUCTOS
// =====================================


function renderProductos(){


let cont=
document.getElementById("productos");


cont.innerHTML="";


menu.forEach(p=>{


let d=document.createElement("div");


d.className="producto";


d.innerHTML=

`

<b>${p.nombre}</b>
<br>
$${p.precio}

`;


d.onclick=()=>agregarProducto(p.nombre);


cont.appendChild(d);


});


}





// =====================================
// RENDER CARRITO
// =====================================


function renderCarrito(){


let div=
document.getElementById("carrito");


div.innerHTML="";


let total=0;



carrito.forEach(i=>{


total+=
i.precio*i.cantidad;



div.innerHTML+=

`

<div>

${i.cantidad}x ${i.nombre}

</div>

`;


});



document.getElementById("total")
.innerText="$"+total;


}




// =====================================
// GENERAR TIPO COMANDA
// =====================================


function obtenerTipoComanda(items){


let estaciones=
items.map(
i=>i.estacion
);



if(
estaciones.includes("MIXTA")
)

return "MIXTA";



if(
estaciones.includes("PARRILLA")
&&
estaciones.includes("COCINA")
)

return "MIXTA";



if(
estaciones.includes("PARRILLA")
)

return "PARRILLA";


return "COCINA";


}





// =====================================
// ENVIAR COMANDA FIREBASE
// =====================================


function enviarComanda(){


if(carrito.length===0){

alert("Sin productos");

return;

}



let items=
carrito.map(
i=>prepararItem(i)
);



let destino=
document.getElementById("ubicacion")
.value;



let tipo=
obtenerTipoComanda(items);



let ahora=Date.now();



let comanda={


mesa:destino,


items:items,


tipoComanda:tipo,


estado:"RECIBIDO",



estado_parrilla:

items.some(
i=>i.estacion==="PARRILLA" ||
i.estacion==="MIXTA"

)

?
"RECIBIDO"
:
"NO_REQUERIDO",



estado_cocina:

items.some(
i=>i.estacion==="COCINA" ||
i.estacion==="MIXTA"

)

?
"RECIBIDO"
:
"NO_REQUERIDO",



timestamp:ahora,


timestamp_estado:ahora,


emisor:"Mariana"


};



db.ref(
"comandas_activas/"+destino
)
.set(comanda);



carrito=[];

renderCarrito();


alert(
"Comanda enviada: "+tipo
);


}






// =====================================
// ESCUCHA COMANDAS
// =====================================


function escucharComandas(){


db.ref("comandas_activas")
.on("value",snap=>{


comandas=
snap.val()||{};


renderMesas();


});


}





// =====================================
// INICIALIZACION
// =====================================


window.onload=function(){


renderProductos();


renderCarrito();


escucharComandas();


escucharChat();


};

// =====================================
// PLANO DE MESAS
// =====================================


const mesas=[

"Salón - Mesa 1",
"Salón - Mesa 2",
"Salón - Mesa 3",
"Salón - Mesa 4",
"Vereda - Mesa 5"

];





function renderMesas(){


let cont=
document.getElementById("mapa");


cont.innerHTML="";


mesas.forEach(mesa=>{


let cmd=
comandas[mesa];



let card=
document.createElement("div");


card.className="mesa";



if(cmd){

card.classList.add("ocupada");


let lista=
cmd.items.map(i=>{


let estado=i.estadoItem;


return `

<div>

${i.cantidad}x ${i.nombre}

<br>

<span class="estado ${estado.toLowerCase()}">

${i.estacion}
-
${estado}

</span>


</div>


`;


}).join("");



let listo=
verificarListo(cmd);



if(listo){

card.classList.add("lista");

}



card.innerHTML=`

<b>${mesa}</b>


<br><br>


${lista}


<br>


<strong>

Estado:
${listo?"🟢 LISTO PARA SERVIR":"🟡 PRODUCCIÓN"}

</strong>


`;



}else{


card.innerHTML=

`

<b>${mesa}</b>

<br><br>

LIBRE

`;

}


cont.appendChild(card);



});



}



////////////////////////////////////////////////////
// CONTROL DE PLATO MIXTO
////////////////////////////////////////////////////



function verificarListo(comanda){



let necesitaParrilla=false;

let necesitaCocina=false;



let parrillaLista=true;

let cocinaLista=true;



comanda.items.forEach(i=>{


if(
i.estacion==="PARRILLA"
||
i.estacion==="MIXTA"
){

necesitaParrilla=true;


if(
i.estadoItem!=="MANOS_EN_MESA"
&&
i.estadoItem!=="LISTO"
){

parrillaLista=false;

}


}




if(
i.estacion==="COCINA"
||
i.estacion==="MIXTA"
){


necesitaCocina=true;



if(
i.estadoItem!=="MANOS_EN_MESA"
&&
i.estadoItem!=="LISTO"
){

cocinaLista=false;

}


}



});



return


(!necesitaParrilla || parrillaLista)

&&

(!necesitaCocina || cocinaLista);



}






////////////////////////////////////////////////////
// CHAT
////////////////////////////////////////////////////



function escucharChat(){


db.ref("mensajes_chat")
.limitToLast(30)

.on("value",snap=>{


let box=
document.getElementById("chat");


box.innerHTML="";


let data=
snap.val();


if(!data)return;



Object.values(data)
.forEach(m=>{


box.innerHTML+=`

<div>

<b>${m.remitente}</b>

<br>

${m.texto}

</div>

<hr>

`;


});


});

}





function enviarMensaje(){


let input=
document.getElementById("mensaje");


if(!input.value)return;



db.ref("mensajes_chat")
.push({

remitente:"Mariana",

texto:input.value,

timestamp:Date.now(),

hora:
new Date()
.toLocaleTimeString()

});



input.value="";


}





////////////////////////////////////////////////////
// APOYO PARA SECTORES
////////////////////////////////////////////////////


function estadoSector(comanda,sector){


let items=
comanda.items.filter(i=>

i.estacion===sector
||
i.estacion==="MIXTA"

);



if(items.length===0)

return "NO_REQUERIDO";



if(
items.every(i=>
i.estadoItem==="MANOS_EN_MESA"
||
i.estadoItem==="LISTO"
)

)

return "MANOS";



return "PENDIENTE";


}





////////////////////////////////////////////////////
// ACTUALIZAR ESTADO DESDE SECTORES
////////////////////////////////////////////////////


function actualizarEstadoGeneral(mesa){


let cmd=
comandas[mesa];


if(!cmd)return;



let parrilla=
estadoSector(cmd,"PARRILLA");


let cocina=
estadoSector(cmd,"COCINA");



db.ref(
"comandas_activas/"+mesa
)

.update({

estado_parrilla:parrilla,

estado_cocina:cocina,


});



}




</script>
