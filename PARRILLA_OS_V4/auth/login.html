<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARRILLA OS - Login</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="../shared/app.css"></head><body><div class="container" style="max-width:430px;padding-top:10vh"><div class="panel"><h1>🔥 PARRILLA OS</h1><p class="muted">Acceso por usuario y sector</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="go()">INGRESAR</button><p id="err" class="danger"></p><p class="muted" style="font-size:11px">Modo piloto puede omitir autenticación según shared/config.js.</p></div></div>
<script src="../shared/config.js"></script><script src="../shared/firebase.js"></script><script src="../shared/permissions.js"></script><script src="../shared/auth.js"></script><script>
async function go(){try{await POS.session.login(email.value.trim(),pass.value);const u=POS.auth.currentUser,p=await POS.session.loadProfile(u);const target={SUPER_ADMIN:'../master/dashboard.html',ADMIN_LOCAL:'../master/dashboard.html',MOZO:'../salon/mozo.html',COCINA:'../cocina/cocina.html',PARRILLA:'../parrilla/parrilla.html',CAJA:'../caja/caja.html',CONTADOR:'../contable/contable.html'}[p?.rol]||'../salon/mozo.html';location.href=target;}catch(e){err.textContent=e.message||'Acceso incorrecto';}}</script></body></html>
